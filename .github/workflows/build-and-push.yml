name: Build and Push (SwampUp 2026 ZTR demo)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  JF_DOCKER_REGISTRY: solenglatest.jfrog.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          version: 2.104.1
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER_NAME }}

      - name: Configure Maven resolution/deployment through alpha-mvn-virtual
        run: |
          jf mvn-config \
            --server-id-resolve=$SETUP_JFROG_CLI_SERVER_IDS --server-id-deploy=$SETUP_JFROG_CLI_SERVER_IDS \
            --repo-resolve-releases=alpha-mvn-virtual --repo-resolve-snapshots=alpha-mvn-virtual \
            --repo-deploy-releases=alpha-mvn-virtual --repo-deploy-snapshots=alpha-mvn-virtual

      - name: Build and publish with jf mvn through alpha-mvn-virtual
        run: jf mvn -B -DskipTests deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to solenglatest Docker registry
        run: jf docker login ${{ env.JF_DOCKER_REGISTRY }}

      - name: Build and push vulnerable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.JF_DOCKER_REGISTRY }}/base-image-remediation-demo/petclinic:vulnerable-${{ steps.vars.outputs.sha_short }}
            ${{ env.JF_DOCKER_REGISTRY }}/base-image-remediation-demo/petclinic:vulnerable-latest
