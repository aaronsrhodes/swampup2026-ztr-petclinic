name: Patch and Push (SwampUp 2026 ZTR demo - remediation)

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  JF_DOCKER_REGISTRY: solenglatest.jfrog.io

jobs:
  patch-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          version: 2.104.1
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER_NAME }}

      - name: Bump log4j-core to chainguard-java's compliant version
        run: |
          COMPLIANT_VERSION=$(jf rt curl -XGET \
            "/artifactory/chainguard-java/org/apache/logging/log4j/log4j-core/maven-metadata.xml" \
            | grep -oE '<release>[^<]+</release>' | sed -E 's#</?release>##g')
          if [ -z "$COMPLIANT_VERSION" ]; then
            echo "Could not determine compliant version from chainguard-java" >&2
            exit 1
          fi
          echo "Compliant version from chainguard-java: $COMPLIANT_VERSION"
          python3 - "$COMPLIANT_VERSION" <<'PYEOF'
          import re, sys
          version = sys.argv[1]
          with open("pom.xml") as f:
              content = f.read()
          pattern = re.compile(
              r"(<groupId>org\.apache\.logging\.log4j</groupId>\s*"
              r"<artifactId>log4j-core</artifactId>\s*<version>)[^<]+(</version>)"
          )
          new_content, n = pattern.subn(rf"\g<1>{version}\g<2>", content)
          assert n == 1, f"expected exactly 1 match, got {n}"
          with open("pom.xml", "w") as f:
              f.write(new_content)
          print(f"pom.xml log4j-core version set to {version}")
          PYEOF

      - name: Configure Maven resolution/deployment through alpha-mvn-virtual
        run: |
          jf mvn-config \
            --server-id-resolve=$SETUP_JFROG_CLI_SERVER_IDS --server-id-deploy=$SETUP_JFROG_CLI_SERVER_IDS \
            --repo-resolve-releases=alpha-mvn-virtual --repo-resolve-snapshots=alpha-mvn-virtual \
            --repo-deploy-releases=alpha-mvn-virtual --repo-deploy-snapshots=alpha-mvn-virtual

      - name: Build patched jar with jf mvn, resolving through alpha-mvn-virtual
        run: jf mvn -B -DskipTests package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to solenglatest Docker registry
        run: jf docker login ${{ env.JF_DOCKER_REGISTRY }}

      - name: Build and push patched image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.JF_DOCKER_REGISTRY }}/base-image-remediation-demo/petclinic:patched-${{ steps.vars.outputs.sha_short }}
            ${{ env.JF_DOCKER_REGISTRY }}/base-image-remediation-demo/petclinic:patched-latest
