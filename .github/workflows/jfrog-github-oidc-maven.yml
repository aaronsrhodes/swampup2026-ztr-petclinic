name: "mpate-petclinic-maven"
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  actions: read
  id-token: write
  packages: write
  contents: read
  security-events: write
env:
  JAVA_VERSION: "21"
  JOB_SUMMARY: true
  JFROG_CLI_LOG_LEVEL: DEBUG
  RT_REPO_MVN_VIRTUAL: "alpha-mvn-virtual"

jobs:
  maven-build-and-publish:
    name: "Maven Package"
    runs-on: ubuntu-latest
    env:
      BUILD_NAME: "mpate-petclinic-maven"
      BUILD_ID: "ga-mvn-${{ github.run_number }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        id: setup-cli
        env:
          JF_URL: ${{ vars.JF_URL }}
        with:
          version: 2.104.1
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER_NAME }}

      - name: Run JFrog CLI
        run: jf rt ping

      - name: "Config Maven with JFrog CLI"
        run: |
          jf mvnc \
            --server-id-resolve=$SETUP_JFROG_CLI_SERVER_IDS --server-id-deploy=$SETUP_JFROG_CLI_SERVER_IDS \
            --repo-resolve-releases=${{ env.RT_REPO_MVN_VIRTUAL }} --repo-resolve-snapshots=${{ env.RT_REPO_MVN_VIRTUAL }} \
            --repo-deploy-releases=${{ env.RT_REPO_MVN_VIRTUAL }} --repo-deploy-snapshots=${{ env.RT_REPO_MVN_VIRTUAL }}

      - name: "Curation: audit"
        continue-on-error: true
        run: |
          rm -f build.gradle settings.gradle
          jf ca --format=table --threads=100

      - name: "Security Audit"
        continue-on-error: true
        run: jf audit --mvn

      - name: "Build and publish Maven artifacts"
        run: |
          jf mvn -B -DskipTests clean deploy \
            --build-name=${{ env.BUILD_NAME }} --build-number=${{ env.BUILD_ID }}

      - name: "Collect env variables"
        run: |
          jf rt bce ${{ env.BUILD_NAME }} ${{ env.BUILD_ID }}
          jf rt bag ${{ env.BUILD_NAME }} ${{ env.BUILD_ID }}

      - name: "Publish BuildInfo"
        run: |
          jf rt bp ${{ env.BUILD_NAME }} ${{ env.BUILD_ID }} --detailed-summary=true

      - name: "Sleep for few seconds"
        env:
          SLEEP_TIME: 30
        run: sleep ${{ env.SLEEP_TIME }}

      - name: "Build Scan"
        run: |
          jf bs ${{ env.BUILD_NAME }} ${{ env.BUILD_ID }} --fail=false --format=table --extended-table=true --rescan=false --vuln=true
